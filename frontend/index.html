<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8fb" />
    <meta name="description" content="Explore source-grounded medical FAQs in English, Hindi, Telugu, and Tamil with IndicMed." />
    <title>IndicMed · Health information in your language</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = localStorage.getItem('indicmed-theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved :
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
